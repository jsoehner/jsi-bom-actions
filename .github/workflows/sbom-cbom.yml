name: Software & Cryptographic Bill of Materials (SBOM & CBOM)

on:
  workflow_call:
    inputs:
      target_dir:
        description: 'Target directory to scan'
        required: false
        type: string
        default: '.'
      output_dir:
        description: 'Directory to store generated BOM artifacts'
        required: false
        type: string
        default: 'oss'
      docs_path:
        description: 'Path where CRYPTOGRAPHIC_AUDIT.md will be published'
        required: false
        type: string
        default: 'docs/security'
      publish_audit:
        description: 'Whether to commit and push the audit report on push'
        required: false
        type: boolean
        default: true
      comment_pr:
        description: 'Whether to post PQC scorecard comment on PRs'
        required: false
        type: boolean
        default: true
    secrets:
      GITHUB_TOKEN:
        required: false

  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  generate-and-verify-boms:
    name: Generate, Verify, and Upload BOMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0

      - name: Run Multi-Language SBOM, CBOM & PQC Governance Action
        uses: jsoehner/sbom-cbom-workflow@main
        with:
          target-dir: ${{ inputs.target_dir || '.' }}
          output-dir: ${{ inputs.output_dir || 'oss' }}
          audit-report-path: ${{ (inputs.docs_path || 'docs/security') }}/CRYPTOGRAPHIC_AUDIT.md
          publish-audit-report: ${{ inputs.publish_audit != false }}
          comment-pr: ${{ inputs.comment_pr != false }}
          upload-artifacts: 'true'
          retention-days: '90'
